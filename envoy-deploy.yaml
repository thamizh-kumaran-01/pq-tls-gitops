apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
spec:
  replicas: 1
  selector:
    matchLabels: { app: envoy }
  template:
    metadata:
      labels: { app: envoy }
    spec:
      containers:
      - name: envoy
        image: envoyproxy/envoy@sha256:7eaa72cd386ad50c2a7744cac90a261458bf9b76197ca72e38f906fa9fd9bb96
        args: ["envoy", "-c", "/etc/envoy-config/envoy.yaml"]
        ports:
        - containerPort: 8443
        - containerPort: 8444
        resources:
          limits: { memory: 256Mi }
        volumeMounts:
        - { name: config, mountPath: /etc/envoy-config, readOnly: true }
        - { name: ecdsa, mountPath: /etc/envoy/certs, readOnly: true }
        - { name: mldsa, mountPath: /etc/envoy/certs-mldsa, readOnly: true }
        - { name: sidecar-ca, mountPath: /etc/envoy/sidecar-ca, readOnly: true }
      volumes:
      - name: config
        configMap: { name: envoy-config }
      - name: ecdsa
        secret: { secretName: envoy-ecdsa, defaultMode: 0444 }
      - name: mldsa
        secret: { secretName: envoy-mldsa, defaultMode: 0444 }
      - name: sidecar-ca
        secret: { secretName: sidecar-ca, defaultMode: 0444 }
---
apiVersion: v1
kind: Service
metadata:
  name: envoy
spec:
  type: LoadBalancer
  selector: { app: envoy }
  ports:
  - { name: ecdsa, port: 8443, targetPort: 8443 }
  - { name: mldsa, port: 8444, targetPort: 8444 }
